<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediPoint — Smarter Pharmacy. Better Control.</title>
  <meta name="description" content="MediPoint is a professional Point of Sale and Medical Store Management System built with Java Spring Boot, Spring Security, JWT, MySQL, and modern UI." />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- MediPoint Custom Theme Stylesheets -->
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Main Application Container -->
  <div id="app">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f8fafc;">
      <div style="text-align: center;">
        <div class="spinner-border text-success" style="width: 3rem; height: 3rem;" role="status">
          <span class="visually-hidden">Loading MediPoint...</span>
        </div>
        <h4 style="font-family: 'Inter', sans-serif; font-weight: 700; color: #0f172a; margin-top: 1.25rem;">MediPoint System Loading</h4>
        <p style="font-family: 'Inter', sans-serif; color: #64748b; font-size: 0.875rem;">Initializing POS & Pharmacy Control Shell...</p>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- MediPoint Main SPA Entry Module -->
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
