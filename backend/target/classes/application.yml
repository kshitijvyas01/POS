server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: medipoint-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medipoint}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:3000,http://127.0.0.1:5500}
  initial-owner:
    email: ${INITIAL_OWNER_EMAIL:owner@medipoint.com}
    password: ${INITIAL_OWNER_PASSWORD:owner123}
    name: ${INITIAL_OWNER_NAME:Store Owner}
    phone: ${INITIAL_OWNER_PHONE:+91 9876543210}

logging:
  level:
    root: INFO
    com.medipoint: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
